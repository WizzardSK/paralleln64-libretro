name: android-preflight
on: [push, workflow_dispatch]
jobs:
  stock-application-mk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: does the NDK still take NDK_TOOLCHAIN_VERSION
        run: |
          git checkout ${{ github.event.before }} -- jni/Application.mk 2>/dev/null || git show upstream/master:jni/Application.mk > jni/Application.mk 2>/dev/null || true
          cat jni/Application.mk
          $ANDROID_NDK_LATEST_HOME/ndk-build --no-print-directory -j$(nproc) -C jni APP_ABI=arm64-v8a 2>&1 | tail -20
        continue-on-error: true
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: ndk-build
        run: |
          $ANDROID_NDK_LATEST_HOME/ndk-build --no-print-directory -j$(nproc) -C jni APP_ABI=${{ matrix.abi }} 2>&1 | tail -40
          mv libs/${{ matrix.abi }}/libretro.so parallel_n64_libretro_android.so
          file parallel_n64_libretro_android.so
          nm -D --defined-only parallel_n64_libretro_android.so | grep -c retro_
